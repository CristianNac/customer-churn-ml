[project]
name = "ml_churn_backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "feature-engine>=1.9.4",
    "imbalanced-learn>=0.14.2",
    "scikit-learn==1.6.1",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.138.0",
    "mypy>=2.1.0",
    "ruff>=0.15.18",
    "skops>=0.14.0",
]

[tool.ruff]
line-length = 88
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
